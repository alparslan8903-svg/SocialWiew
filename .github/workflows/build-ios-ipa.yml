name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA (macOS Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build Release app for iOS (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project SocialWiew.xcodeproj \
            -scheme SocialWiew \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Payload into SocialWiew.ipa
        working-directory: ios
        run: |
          mkdir -p ipa_out/Payload
          cp -R build/Build/Products/Release-iphoneos/SocialWiew.app ipa_out/Payload/
          cd ipa_out
          zip -qry ../SocialWiew-unsigned.ipa Payload

      - name: Upload SocialWiew-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialWiew-unsigned-ipa
          path: ios/SocialWiew-unsigned.ipa
          if-no-files-found: error
