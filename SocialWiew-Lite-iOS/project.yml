name: SocialWiewLite
options:
  bundleIdPrefix: com.aistudio
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "10.29.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "7.1.0"
targets:
  SocialWiewLite:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: SocialWiewLite/Sources
      - path: SocialWiewLite/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialwiew.lite
        PRODUCT_NAME: SocialWiew Lite
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        INFOPLIST_FILE: SocialWiewLite/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OPTIMIZATION_LEVEL: "-Osize"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
