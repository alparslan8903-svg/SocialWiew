name: SocialWiew
options:
  bundleIdPrefix: com.aistudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  SocialWiew:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SocialWiew/Sources
      - path: SocialWiew/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialwiew
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SocialWiew/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
